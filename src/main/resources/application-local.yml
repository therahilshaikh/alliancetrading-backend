spring:
  datasource:
    # NeonDB. The password is never committed: set DATABASE_PASSWORD in your environment.
    # Override DATABASE_URL to use the docker-compose Postgres instead
    # (jdbc:postgresql://localhost:5432/alliancetrading, postgres/postgres).
    url: ${DATABASE_URL:jdbc:postgresql://ep-mute-wind-b5goc44g.c-7.us-east-2.aws.neon.tech/neondb?sslmode=require&channelBinding=require}
    username: ${DATABASE_USERNAME:neondb_owner}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 5

app:
  security:
    jwt:
      secret: bG9jYWwtZGV2LWp3dC1zZWNyZXQtbG9jYWwtZGV2LWp3dC1zZWNyZXQtbG9jYWw=
    otp:
      pepper: bG9jYWwtZGV2LW90cC1wZXBwZXItbG9jYWwtZGV2LW90cC1wZXBwZXI=
  crypto:
    master-key: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
    hash-pepper: bG9jYWwtZGV2LWhhc2gtcGVwcGVyLWxvY2FsLWRldg==
  cors:
    # Admin console dev server (Vite). Override with CORS_ALLOWED_ORIGINS (comma-separated).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://192.168.0.157:8080,http://localhost:8081}
  storage:
    # Cloudflare R2. Keys are never committed: set R2_ACCESS_KEY / R2_SECRET_KEY in your environment.
    endpoint: ${R2_ENDPOINT:https://cbbe7d03d00942a230b6065bdf3f731a.r2.cloudflarestorage.com}
    bucket: ${R2_BUCKET:alliance-trading-test}
    region: auto
    access-key: ${R2_ACCESS_KEY:}
    secret-key: ${R2_SECRET_KEY:}

logging:
  level:
    in.ruhmans.alliancetrading: debug
