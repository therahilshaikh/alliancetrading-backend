spring:
  application:
    name: alliancetrading
  datasource:
    hikari:
      # Neon suspends idle compute (~5 min) and drops its connections; retire ours first.
      # minimum-idle 0 lets idle connections close so the compute can still auto-suspend.
      minimum-idle: 0
      idle-timeout: 120000
      max-lifetime: 240000
      keepalive-time: 60000
      # Allow for a cold start when the compute is waking up
      connection-timeout: 30000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      # Group multi-row writes (ledger postings, P&L allocations) into JDBC batches
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
      hibernate.order_updates: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port: 8080

# Only the health endpoint is exposed (public, used by the deploy pipeline); details stay hidden
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  business-timezone: Asia/Kolkata
  bank-change-cooloff-hours: 48
  security:
    jwt:
      # 256-bit+ base64-encoded HMAC secret for signing access tokens
      secret: ${JWT_SECRET:}
      access-token-ttl: PT15M
      admin-access-token-ttl: PT30M
      refresh-token-ttl: P30D
    otp:
      # base64-encoded pepper for HMAC-SHA256 of OTP codes
      pepper: ${OTP_PEPPER:}
      ttl: PT5M
      max-verify-attempts: 5
      max-requests-per-mobile: 3
      mobile-window: PT15M
      max-requests-per-ip: 20
      ip-window: PT1H
      # Local/dev automated tests only: every OTP becomes this 6-digit code. Startup fails unless app.sms.provider=logging.
      fixed-code: 123456
    admin:
      max-failed-logins: 5
      lock-duration: PT15M
      idle-timeout: PT30M
  crypto:
    # base64-encoded 32-byte master key for envelope/field encryption
    master-key: ${MASTER_KEY:}
    key-id: ${MASTER_KEY_ID:k1}
    # base64-encoded pepper for HMAC-SHA256 uniqueness hashes (PAN, etc.)
    hash-pepper: ${HASH_PEPPER:}
  storage:
    endpoint: ${S3_ENDPOINT}
    region: ${S3_REGION:auto}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    bucket: ${S3_BUCKET}
  sms:
    # logging (prints SMS to the log, local dev) | fast2sms
    provider: logging
    fast2sms:
      api-key: ${FAST2SMS_API_KEY:}
      # dlt (registered sender + templates; production) | otp (Fast2SMS OTP route; OTPs only)
      route: ${FAST2SMS_ROUTE:dlt}
      sender-id: ${FAST2SMS_SENDER_ID:}
      # Fast2SMS DLT message ID for the OTP template (the only SMS sent; see SmsTemplate)
      templates:
        OTP: ${FAST2SMS_TEMPLATE_OTP:}
  push:
    provider: logging
  cors:
    # Comma-separated origins allowed to call the API from a browser (admin web console).
    # The React Native app does not need CORS.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

logging:
  level:
    root: info
