spring:
  datasource:
    # NeonDB. The password is never committed: set DATABASE_PASSWORD in your environment.
    url: ${DATABASE_URL:jdbc:postgresql://ep-mute-wind-b5goc44g.c-7.us-east-2.aws.neon.tech/neondb?sslmode=require&channelBinding=require}
    username: ${DATABASE_USERNAME:neondb_owner}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 5

app:
  security:
    jwt:
      secret: ${JWT_SECRET:ZGV2LWp3dC1zZWNyZXQtZGV2LWp3dC1zZWNyZXQtZGV2LWp3dC1zZWNyZXQtZGV2}
    otp:
      pepper: ${OTP_PEPPER:ZGV2LW90cC1wZXBwZXItZGV2LW90cC1wZXBwZXItZGV2LW90cC1wZXBwZXI=}
  crypto:
    master-key: ${MASTER_KEY:AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=}
    hash-pepper: ${HASH_PEPPER:ZGV2LWhhc2gtcGVwcGVyLWRldi1oYXNoLXBlcHBlci1kZXY=}
  cors:
    # Admin console dev server (Vite). Override with CORS_ALLOWED_ORIGINS (comma-separated).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  sms:
    # logging prints OTPs to the console; set SMS_PROVIDER=fast2sms to send real SMS
    provider: ${SMS_PROVIDER:logging}

logging:
  level:
    in.ruhmans.alliancetrading: debug
