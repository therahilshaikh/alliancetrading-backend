# Deployment: the app against external infrastructure (Neon Postgres + Cloudflare R2).
# No local Postgres/MinIO — credentials come from a .env file next to this file
# (copy your secrets file to .env; docker compose reads it automatically).
#
#   cp alliancetrading-secrets.env .env
#   docker compose up -d --build
#
# Required in .env (see application-prod.yml): DATABASE_URL, DATABASE_USERNAME,
# DATABASE_PASSWORD, R2_ENDPOINT, R2_ACCESS_KEY, R2_SECRET_KEY, JWT_SECRET,
# OTP_PEPPER, MASTER_KEY, HASH_PEPPER, FAST2SMS_API_KEY, FAST2SMS_SENDER_ID,
# FAST2SMS_TEMPLATE_OTP, CORS_ALLOWED_ORIGINS.

services:
  app:
    build: .
    container_name: alliancetrading-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
      S3_BUCKET: ${R2_BUCKET}
      JWT_SECRET: ${JWT_SECRET}
      OTP_PEPPER: ${OTP_PEPPER}
      MASTER_KEY: ${MASTER_KEY}
      MASTER_KEY_ID: ${MASTER_KEY_ID:-k1}
      HASH_PEPPER: ${HASH_PEPPER}
      SMS_PROVIDER: ${SMS_PROVIDER:-fast2sms}
      FAST2SMS_API_KEY: ${FAST2SMS_API_KEY}
      FAST2SMS_ROUTE: ${FAST2SMS_ROUTE:-dlt}
      FAST2SMS_SENDER_ID: ${FAST2SMS_SENDER_ID}
      FAST2SMS_TEMPLATE_OTP: ${FAST2SMS_TEMPLATE_OTP}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
