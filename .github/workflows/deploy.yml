# Test -> build image (GHCR) -> deploy to EC2 over SSH, with a health check and automatic rollback.
#
# Repository secrets (Settings > Secrets and variables > Actions), ideally on the "production" environment:
#   EC2_HOST, EC2_USER, EC2_SSH_KEY            SSH access to the server
#   DATABASE_URL, DATABASE_USERNAME, DATABASE_PASSWORD
#   JWT_SECRET, OTP_PEPPER, MASTER_KEY, HASH_PEPPER (MASTER_KEY_ID optional, defaults to k1)
#   R2_ENDPOINT, R2_ACCESS_KEY, R2_SECRET_KEY, R2_BUCKET
#   FAST2SMS_API_KEY, FAST2SMS_SENDER_ID, FAST2SMS_TEMPLATE_OTP
#   CORS_ALLOWED_ORIGINS (optional)
# Optional repository variable: DEPLOY_DIR (default "alliancetrading", relative to the SSH user's home).
#
# Server prerequisites: Docker Engine + Compose plugin, curl, and the SSH user in the docker group.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits rather than cancelling a deploy halfway
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unit + Testcontainers integration tests (Docker is available on GitHub-hosted runners)
      - name: Test
        run: sh ./mvnw -B verify

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      # Relative paths are under the SSH user's home directory
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || 'alliancetrading' }}
    steps:
      - uses: actions/checkout@v4

      # Built from secrets on the runner; values never appear in the log
      - name: Write .env
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OTP_PEPPER: ${{ secrets.OTP_PEPPER }}
          MASTER_KEY: ${{ secrets.MASTER_KEY }}
          MASTER_KEY_ID: ${{ secrets.MASTER_KEY_ID }}
          HASH_PEPPER: ${{ secrets.HASH_PEPPER }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          FAST2SMS_API_KEY: ${{ secrets.FAST2SMS_API_KEY }}
          FAST2SMS_SENDER_ID: ${{ secrets.FAST2SMS_SENDER_ID }}
          FAST2SMS_TEMPLATE_OTP: ${{ secrets.FAST2SMS_TEMPLATE_OTP }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
        run: |
          umask 077
          : > .env
          for key in DATABASE_URL DATABASE_USERNAME DATABASE_PASSWORD JWT_SECRET OTP_PEPPER MASTER_KEY \
                     MASTER_KEY_ID HASH_PEPPER R2_ENDPOINT R2_ACCESS_KEY R2_SECRET_KEY R2_BUCKET \
                     FAST2SMS_API_KEY FAST2SMS_SENDER_ID FAST2SMS_TEMPLATE_OTP CORS_ALLOWED_ORIGINS; do
            value="${!key}"
            if [ -z "$value" ]; then
              case "$key" in
                CORS_ALLOWED_ORIGINS|MASTER_KEY_ID) continue ;;
                *) echo "::error::Secret $key is not set"; exit 1 ;;
              esac
            fi
            printf '%s=%s\n' "$key" "$value" >> .env
          done
          printf 'IMAGE_NAME=%s\n' "$IMAGE_NAME" >> .env

      - name: Copy compose file and .env to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.yml,.env
          target: ${{ env.DEPLOY_DIR }}

      - name: Deploy, health check, roll back on failure
        uses: appleboy/ssh-action@v1.2.0
        env:
          NEW_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: NEW_TAG,GHCR_USER,GHCR_TOKEN,DEPLOY_DIR
          script: |
            set -eu
            case "$DEPLOY_DIR" in
              /*) cd "$DEPLOY_DIR" ;;
              *) cd "$HOME/$DEPLOY_DIR" ;;
            esac
            chmod 600 .env

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

            PREV_TAG="$(cat .deployed_tag 2>/dev/null || true)"

            healthy() {
              for i in $(seq 1 30); do
                if curl -fsS http://localhost:8080/actuator/health/readiness >/dev/null 2>&1; then
                  return 0
                fi
                sleep 5
              done
              return 1
            }

            IMAGE_TAG="$NEW_TAG" docker compose pull app
            IMAGE_TAG="$NEW_TAG" docker compose up -d --no-build app

            if healthy; then
              echo "$NEW_TAG" > .deployed_tag
              docker image prune -f >/dev/null
              echo "Deployed $NEW_TAG"
            else
              echo "Health check failed for $NEW_TAG"
              docker compose logs --tail 100 app || true
              if [ -n "$PREV_TAG" ]; then
                echo "Rolling back to $PREV_TAG"
                IMAGE_TAG="$PREV_TAG" docker compose up -d --no-build app
              fi
              exit 1
            fi
